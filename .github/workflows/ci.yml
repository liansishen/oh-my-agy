name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-push-guard:
    name: Guard direct push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify direct push only touches README.md (or came from a merged PR)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          # Allow merge commits created by GitHub Pull Requests
          PARENTS="$(git rev-list --parents -n 1 "$AFTER_SHA" | awk '{print NF-1}')"
          SUBJECT="$(git log -1 --pretty=%s "$AFTER_SHA")"
          if [ "$PARENTS" -gt 1 ] || [[ "$SUBJECT" =~ \(#[0-9]+\)$ ]]; then
            echo "Merged Pull Request commit detected; guard passed."
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          NON_README="$(printf '%s\n' "$CHANGED" | grep -vE '^$|^(README(\.[A-Za-z0-9_-]+)?\.md)$' || true)"
          if [ -n "$NON_README" ]; then
            echo "Direct push to main modified non-README files:" >&2
            printf '  %s\n' $NON_README >&2
            echo "Policy: direct pushes to main are restricted to README.md only. Open a Pull Request instead." >&2
            exit 1
          fi
          echo "Direct push only touched README files; guard passed."

  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run full test suite
        run: bun test

  build-check:
    name: Cross-compile Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux & Windows binaries and verify --version
        run: |
          mkdir -p dist-ci
          bun build --compile --target=bun-linux-x64 src/bin/oma.ts --outfile dist-ci/oma-linux-x64
          bun build --compile --target=bun-windows-x64 src/bin/oma.ts --outfile dist-ci/oma-windows-x64.exe
          PKG_VER="$(node -p "require('./package.json').version")"
          BUILT_VER="$(./dist-ci/oma-linux-x64 --version)"
          echo "Built binary version: $BUILT_VER"
          if [[ "$BUILT_VER" != "oma ${PKG_VER} "* ]]; then
            echo "Built binary version does not match package.json ($PKG_VER): $BUILT_VER" >&2
            exit 1
          fi
